<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="INSCA">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb8e6"/>
      <stop offset=".5" stop-color="#3f6fc4"/>
      <stop offset="1" stop-color="#26478f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f3f7"/>
    </linearGradient>
  </defs>

  <!-- app-icon plate (clean white, like the logo background) -->
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#e6e9f0" stroke-width="4"/>

  <!-- soft ground shadow -->
  <ellipse cx="256" cy="356" rx="150" ry="20" fill="#14161c" opacity=".08"/>

  <g stroke="#9aa3b2" stroke-width="2.5">
    <!-- metallic blue bar -->
    <rect x="150" y="234" width="212" height="44" rx="22" fill="url(#bar)"/>
    <!-- end caps -->
    <rect x="86" y="214" width="26" height="84" rx="9" fill="url(#bar)"/>
    <rect x="400" y="214" width="26" height="84" rx="9" fill="url(#bar)"/>

    <!-- LEFT plate stack: saffron · white · green -->
    <rect x="116" y="176" width="30" height="160" rx="10" fill="#f58220"/>
    <rect x="150" y="176" width="30" height="160" rx="10" fill="#f3f5f8"/>
    <rect x="184" y="176" width="30" height="160" rx="10" fill="#159a4e"/>

    <!-- RIGHT plate stack: green · white · saffron -->
    <rect x="298" y="176" width="30" height="160" rx="10" fill="#159a4e"/>
    <rect x="332" y="176" width="30" height="160" rx="10" fill="#f3f5f8"/>
    <rect x="366" y="176" width="30" height="160" rx="10" fill="#f58220"/>
  </g>
</svg>
